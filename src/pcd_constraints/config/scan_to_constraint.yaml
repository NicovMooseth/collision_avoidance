# Parameter VALUES for scan_to_constraint_node (convention rule 4), loaded by the launch file.
# The top-level key must match the node name given in the node's constructor.
# Every parameter here must be declared in src/scan_to_constraint_params.yaml.
scan_to_constraint_node:
  ros__parameters:

    topics:
      input:
        points: "/rms2/lidar/points"
        state: "/filter/state_estimate"
      output:
        constraints: "/collision_avoidance/constraints"

    range:
      min: 0.5
      max: 30.0

    tf:
      publish: true           # bag has no /tf; turn off on the drone if TF already exists

    state:
      buffer_duration: 1.0    # clouds arrive ~0.12 s after their stamp
      max_time_offset: 0.05   # states come at 50 Hz: nearest one is <= 10 ms away

    # Sensor -> body extrinsic T_BS, copied from ros_data/ROS2_example_and_bag/sensor_extrinsics_jt128.yaml
    extrinsics:
      fast_lio_to_body:
        translation: [0.0, 0.0, 0.0]   # the LiDAR is taken as the drone's center
        rotation:
          [0.00000000, -0.02565353,  0.99967089,
           0.99999986, -0.00052343, -0.00001343,
           0.00052360,  0.99967076,  0.02565352]
